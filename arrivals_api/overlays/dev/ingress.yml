apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arrivals
spec:
  tls:
    - hosts:
        - dev-arrivals.moody
      secretName: arrivals-dev-tls
  rules:
    - host: dev-arrivals.moody
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arrivals
                port:
                  number: 3000
