apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  project: bootstrap
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: v1.12.1
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false
    - repoURL: https://github.com/moodyRahman/k8s-monorepo
      path: ./longhorn
      targetRevision: HEAD
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
